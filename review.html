<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - AI-Driven Crop Planner</title>
    <link rel="stylesheet" href="app.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #EAF4E1;
        }
        .review-container {
            background-color: #F8F9E6;
            padding: 20px;
            border: 2px solid #94A684;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .stars span {
            font-size: 30px;
            color: #ccc;
            cursor: pointer;
        }
        .stars span.selected,
        .stars span:hover,
        .stars span:hover ~ span {
            color: gold;
        }
        textarea {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            border: 2px solid #94A684;
            padding: 10px;
        }
        button {
            background-color: #6B8E23;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #556B2F;
        }
    </style>
</head>
<body>
    <div class="review-container">
        <h2>Submit Your Review</h2>
        
        <div class="stars" id="stars">
            <span data-value="1">&#9733;</span>
            <span data-value="2">&#9733;</span>
            <span data-value="3">&#9733;</span>
            <span data-value="4">&#9733;</span>
            <span data-value="5">&#9733;</span>
        </div>

        <textarea placeholder="Write your review here..."></textarea>
        <button onclick="alert('Thank you for your feedback!')">Submit</button>
    </div>

    <script>
        const stars = document.querySelectorAll('#stars span');
        let selectedRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(star.getAttribute('data-value'));
                updateStarSelection(selectedRating);
            });

            star.addEventListener('mouseover', function() {
                updateStarSelection(parseInt(star.getAttribute('data-value')));
            });

            star.addEventListener('mouseout', function() {
                updateStarSelection(selectedRating);
            });
        });

        function updateStarSelection(rating) {
            stars.forEach(star => {
                const starValue = parseInt(star.getAttribute('data-value'));
                star.style.color = starValue <= rating ? 'gold' : '#ccc';
            });
        }
    </script>
</body>
</html>
